  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1628; color: #fff; height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 14px 20px;
      background: linear-gradient(135deg, #0d2137 0%, #0a3d62 100%);
      border-bottom: 1px solid #1e4a7a;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      z-index: 1000;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
    header h1 span { color: #38bdf8; }
    .badge {
      background: #38bdf8;
      color: #0a1628;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      letter-spacing: 0.3px;
    }

    .controls {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .controls input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      padding: 6px 12px;
      outline: none;
      width: 200px;
      transition: border-color 0.2s;
    }
    .controls input::placeholder { color: rgba(255,255,255,0.4); }
    .controls input:focus { border-color: #38bdf8; }

    .controls select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
    }
    .controls select option { background: #0d2137; }

    #map { flex: 1; }

    /* Leaflet popup override */
    .leaflet-popup-content-wrapper {
      background: #0d2137;
      color: #fff;
      border: 1px solid #1e4a7a;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: #0d2137; }
    .leaflet-popup-content { margin: 12px 16px; }
    .popup-name { font-size: 1rem; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .popup-county { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
    .popup-normal {
      font-size: 0.78rem;
      background: rgba(56,189,248,0.12);
      border: 1px solid rgba(56,189,248,0.25);
      border-radius: 6px;
      padding: 4px 8px;
      display: inline-block;
      color: #7dd3fc;
    }

    .status-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,22,40,0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #1e4a7a;
      border-radius: 99px;
      padding: 6px 18px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
      z-index: 999;
      pointer-events: none;
    }
    .status-bar span { color: #38bdf8; font-weight: 600; }
  </style>
</head>

// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [54.5, -3.5],
  zoom: 6,
  zoomControl: true,
  attributionControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://carto.com/">CARTO</a> | Beach data: Sailsforce',
  maxZoom: 19,
  subdomains: 'abcd'
}).addTo(map);

// ── Marker icon ────────────────────────────────────────────────────────────
function makeIcon(highlight) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${highlight ? 14 : 9}px;
      height:${highlight ? 14 : 9}px;
      background:${highlight ? '#f0abfc' : '#38bdf8'};
      border:2px solid ${highlight ? '#e879f9' : '#0a3d62'};
      border-radius:50%;
      box-shadow:0 0 ${highlight ? 8 : 4}px ${highlight ? '#e879f9' : '#38bdf8'}88;
      transition:all .2s;
    "></div>`,
    iconSize: [highlight ? 14 : 9, highlight ? 14 : 9],
    iconAnchor: [highlight ? 7 : 4.5, highlight ? 7 : 4.5],
  });
}

// ── Build markers ──────────────────────────────────────────────────────────
const markers = BEACHES.map(b => {
  const m = L.marker([b.lat, b.lng], { icon: makeIcon(false) });
  m.beachData = b;
  m.bindPopup(`
    <div class="popup-name">${b.name}</div>
    <div class="popup-county">${[b.city, b.county].filter(Boolean).join(', ')}</div>
    ${b.normal != null ? `<div class="popup-normal">🧭 Shore normal: ${b.normal.toFixed(1)}°</div>` : ''}
  `, { maxWidth: 240 });
  return m;
});

// ── Cluster-style layer group ──────────────────────────────────────────────
const layerGroup = L.layerGroup(markers).addTo(map);

// ── County dropdown ────────────────────────────────────────────────────────
const counties = [...new Set(BEACHES.map(b => b.county).filter(Boolean))].sort();
const sel = document.getElementById('county-filter');
counties.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  sel.appendChild(o);
});

// ── Filter logic ───────────────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const county = sel.value;
  let count = 0;

  markers.forEach(m => {
    const b = m.beachData;
    const nameMatch = !q || b.name.toLowerCase().includes(q) || b.city.toLowerCase().includes(q);
    const countyMatch = !county || b.county === county;
    const visible = nameMatch && countyMatch;

    if (visible) {
      if (!layerGroup.hasLayer(m)) layerGroup.addLayer(m);
      m.setIcon(makeIcon(q && b.name.toLowerCase().includes(q)));
      count++;
    } else {
      if (layerGroup.hasLayer(m)) layerGroup.removeLayer(m);
    }
  });

  document.getElementById('visible-count').textContent = count;
  document.getElementById('count-badge').textContent = count + ' beaches';

  // Auto-zoom to first match when searching by name
  if (q) {
    const first = markers.find(m => layerGroup.hasLayer(m));
    if (first) map.setView([first.beachData.lat, first.beachData.lng], 12);
  }
}

document.getElementById('search').addEventListener('input', applyFilters);
sel.addEventListener('change', applyFilters);
</script>
